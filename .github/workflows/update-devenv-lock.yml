name: Update devenv.lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-devenv-lock
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Update devenv.lock
        run: devenv update

      - name: Verify environment
        run: devenv test

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          branch: chore/update-devenv-lock
          delete-branch: true
          commit-message: "chore(deps): update devenv.lock"
          title: "chore(deps): update devenv.lock"
          body: Automated update of `devenv.lock` via `devenv update`.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --delete-branch --auto || gh pr merge "$PR" --squash --delete-branch
